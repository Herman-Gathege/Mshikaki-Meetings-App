[project]
name = "mshikaki-backend"
version = "0.1.0"
description = "Mshikaki API: sessions, ideas, decisions, tasks and the audit trail"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    # Starlette 1.x requires httpx2 for its TestClient; plain httpx hangs.
    # Keep both: httpx for async ASGI tests, httpx2 for TestClient.
    "httpx2>=1.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Only our own deprecations are fatal; library noise should not break the build.
filterwarnings = ["error::DeprecationWarning:app.*", "error::DeprecationWarning:tests.*"]
